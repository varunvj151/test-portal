version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: debugcontest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: debuguser
      POSTGRES_PASSWORD: debugpass
      POSTGRES_DB: debugcontest
    ports:
      - "5432:5432"
    volumes:
      - debugcontest-pgdata:/var/lib/postgresql/data

volumes:
  debugcontest-pgdata:
